version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fpt-tracking-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - RabbitMQ__HostName=host.docker.internal
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=FPTTrackingSystem;User Id=sa;Password=StrongP@ssw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=True
    volumes:
      - ./wwwroot:/app/wwwroot
    # SQL Server và RabbitMQ đã được build riêng
    # Kết nối qua host.docker.internal hoặc IP của host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - fpt-tracking-network

networks:
  fpt-tracking-network:
    driver: bridge

