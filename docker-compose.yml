version: '3.8'

services:
  # Main API Application
  fpt-tracking-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fpt-tracking-api
    ports:
      - "5000:5000"  # HTTPS port
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      
      # Database connection string - External SQL Server
      - ConnectionStrings__DefaultConnection=Server=160.30.21.113;Database=FPTTrackingSystem;User Id=sa;Password=ak47;TrustServerCertificate=True
      
      # JWT Settings
      - JwtSettings__SecretKey=mat-khau-sieu-manh-cua-gioi-doan
      - JwtSettings__Issuer=FPTTrackingSystem
      - JwtSettings__Audience=FPTTrackingUsers
      - JwtSettings__ExpiryMinutes=60
      
      # Mail Settings
      - MailSettings__Mail=gioidmhe171512@fpt.edu.vn
      - MailSettings__DisplayName=FPTTrackingSystem
      - MailSettings__Password=tbgk hauq ffqm zrtf
      - MailSettings__Host=smtp.gmail.com
      - MailSettings__Port=587
      
      # RabbitMQ Settings (if using external RabbitMQ, update hostname)
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__QueueName=mail_queue
      
    volumes:
      - app-data:/app/wwwroot
      # Mount certificate if you have one (optional for now)
      # - ./certs/myappcert.pfx:/app/certs/myappcert.pfx:ro
    networks:
      - fpt-network
    restart: unless-stopped
    depends_on:
      - rabbitmq

  # SQL Server Database (Optional - uncomment if needed)
  # db:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   container_name: fpt-tracking-db
  #   environment:
  #     - ACCEPT_EULA=Y
  #     - SA_PASSWORD=YourPassword123!
  #     - MSSQL_PID=Express
  #   ports:
  #     - "1433:1433"
  #   volumes:
  #     - db-data:/var/opt/mssql
  #   networks:
  #     - fpt-network
  #   restart: unless-stopped

  # RabbitMQ (for messaging)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fpt-tracking-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - fpt-network
    restart: unless-stopped

networks:
  fpt-network:
    driver: bridge

volumes:
  app-data:
  rabbitmq-data:
