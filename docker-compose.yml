version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fpt-tracking-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - RabbitMQ__HostName=rabbitmq
    volumes:
      - ./wwwroot:/app/wwwroot
    depends_on:
      - rabbitmq
    restart: unless-stopped
    networks:
      - fpt-tracking-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fpt-tracking-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - fpt-tracking-network

volumes:
  rabbitmq_data:

networks:
  fpt-tracking-network:
    driver: bridge

