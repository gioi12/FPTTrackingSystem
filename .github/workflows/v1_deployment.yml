name: Build & Deploy to IIS

on:
  push:
    branches: [ "main" ]  

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      # 1. Lấy code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Cài .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0  

      # 3. Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore

      # 4. Build để check lỗi compile
      - name: Build
        run: dotnet build --configuration Release --no-restore

      # 6. Publish ra thư mục ./publish
      - name: Publish
        run: dotnet publish -c Release -o ./publish

      # 7. Deploy lên IIS qua WinRM
      - name: Deploy to IIS via WinRM
        uses: microsoft/psremoting@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASS }}
          script: |
            $target = "C:\inetpub\myapp"

            # Xoá file cũ
            Remove-Item "$target\*" -Recurse -Force

            # Copy file mới từ thư mục publish
            Copy-Item ".\publish\*" $target -Recurse -Force

            # Restart IIS để chạy code mới
            iisreset
