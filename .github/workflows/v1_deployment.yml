name: Build & Deploy to IIS
on:
  push:
    branches: [ "main" ]  
jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      # 1. Lấy code
      - name: Checkout source
        uses: actions/checkout@v4
      
      # 2. Cài .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0  
      
      # 3. Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore
      
      # 4. Build & Publish
      - name: Build & Publish self-contained
        run: dotnet publish ./FPTTrackingSystem/FPTTrackingSystem.csproj `
          -c Release -r win-x64 --self-contained true `
          -p:TreatWarningsAsErrors=false `
          -o ./publish
      
      # 5. Zip file để transfer
      - name: Compress published files
        run: Compress-Archive -Path ./publish/* -DestinationPath ./deploy.zip
      
      # 6. Deploy to IIS
      - name: Deploy to IIS via WinRM
        shell: pwsh
        env:
          APPSETTINGS_JSON: ${{ secrets.APPSETTINGS_PRODUCTION }}
        run: |
          # Tạo credential
          $user = "${{ secrets.VPS_USER }}"
          $pass = ConvertTo-SecureString "${{ secrets.VPS_PASS }}" -AsPlainText -Force
          $cred = New-Object System.Management.Automation.PSCredential($user, $pass)
          
          # Session options
          $sessionOption = New-PSSessionOption -SkipCACheck -SkipCNCheck -SkipRevocationCheck
          
          try {
            Write-Host "Connecting to server ${{ secrets.VPS_HOST }}..."
            
            # Kết nối WinRM qua HTTPS
            $session = New-PSSession -ComputerName "${{ secrets.VPS_HOST }}" `
                                      -Port 5986 `
                                      -UseSSL `
                                      -Credential $cred `
                                      -SessionOption $sessionOption
            
            Write-Host "✓ Connected successfully"
            
            # Tạo thư mục Temp nếu chưa có
            Invoke-Command -Session $session -ScriptBlock {
              if (-not (Test-Path "C:\Temp")) {
                New-Item -ItemType Directory -Path "C:\Temp" -Force
              }
            }
            
            # Copy file zip lên server
            Write-Host "Uploading deployment package..."
            $localZip = ".\deploy.zip"
            $remoteZip = "C:\Temp\deploy.zip"
            Copy-Item -Path $localZip -Destination $remoteZip -ToSession $session -Force
            Write-Host "✓ Upload completed"
            
            # Deploy trên server
            Write-Host "Deploying to C:\Users\Administrator\Desktop\Publish-BE..."
            
            $productionSettings = $env:APPSETTINGS_JSON
            
            Invoke-Command -Session $session -ArgumentList $productionSettings -ScriptBlock {
              param($prodSettings)
              
              $target = "C:\Users\Administrator\Desktop\Publish-BE"
              $tempDeploy = "C:\Users\Administrator\Desktop\Publish-BE-New"
              $oldDeploy = "C:\Users\Administrator\Desktop\Publish-BE-Old"
              $tempZip = "C:\Temp\deploy.zip"
              
              Import-Module WebAdministration -ErrorAction SilentlyContinue
              
              # Tìm app pool và site
              $site = Get-ChildItem IIS:\Sites | Where-Object { 
                $_.PhysicalPath -eq $target 
              } | Select-Object -First 1
              
              if ($site) {
                $appPoolName = $site.applicationPool
                $siteName = $site.Name
                Write-Host "Found site: $siteName, app pool: $appPoolName"
                
                # Dừng app pool
                Write-Host "Stopping app pool..."
                Stop-WebAppPool -Name $appPoolName -ErrorAction SilentlyContinue
                
                # Chờ app pool dừng
                $timeout = 30
                $elapsed = 0
                do {
                  Start-Sleep -Seconds 1
                  $elapsed++
                  $state = (Get-WebAppPoolState -Name $appPoolName).Value
                } while ($state -ne "Stopped" -and $elapsed -lt $timeout)
                
                Write-Host "✓ App pool stopped"
              } else {
                Write-Host "Warning: No IIS site found for this path"
              }
              
              # Xóa thư mục tạm nếu tồn tại
              if (Test-Path $tempDeploy) {
                Remove-Item $tempDeploy -Recurse -Force
              }
              
              # Giải nén vào thư mục tạm
              Write-Host "Extracting files to temporary directory..."
              Expand-Archive -Path $tempZip -DestinationPath $tempDeploy -Force
              Write-Host "✓ Files extracted"

              Write-Host "Creating appsettings.Production.json..."
              Set-Content -Path "$tempDeploy\appsettings.Production.json" -Value $prodSettings -Encoding UTF8
              Write-Host "✓ appsettings.Production.json created"
              
              # Swap thư mục (atomic operation)
              Write-Host "Swapping directories..."
              
              if ($site) {
                # Đổi physical path của site sang thư mục mới
                Set-ItemProperty "IIS:\Sites\$siteName" -Name physicalPath -Value $tempDeploy
                Write-Host "✓ Site physical path updated to new directory"
                
                # Start lại app pool
                Write-Host "Starting app pool..."
                Start-WebAppPool -Name $appPoolName -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 3
                
                $state = (Get-WebAppPoolState -Name $appPoolName).Value
                Write-Host "✓ App pool started (state: $state)"
              }
              
              # Xóa thư mục cũ (nếu có) - giờ đã không còn bị lock
              if (Test-Path $oldDeploy) {
                Write-Host "Removing old backup directory..."
                Remove-Item $oldDeploy -Recurse -Force -ErrorAction SilentlyContinue
              }
              
              # Đổi tên thư mục cũ thành backup
              if (Test-Path $target) {
                Write-Host "Moving old directory to backup..."
                Rename-Item $target $oldDeploy -Force
              }
              
              # Đổi tên thư mục mới thành tên chính thức
              Write-Host "Moving new directory to production..."
              Rename-Item $tempDeploy $target -Force
              
              Write-Host "Setting permissions..."
              icacls $target /grant "IIS_IUSRS:(OI)(CI)F" /T /Q | Out-Null
              if ($site) {
                icacls $target /grant "IIS AppPool\$($appPoolName):(OI)(CI)F" /T /Q | Out-Null
              }
              icacls $target /grant "NETWORK SERVICE:(OI)(CI)F" /T /Q | Out-Null
              Write-Host "✓ Permissions set"
              
              # Cập nhật lại physical path về đúng tên
              if ($site) {
                Set-ItemProperty "IIS:\Sites\$siteName" -Name physicalPath -Value $target
                Write-Host "✓ Site physical path updated to production directory"
              }
              
              # Xóa file zip tạm
              Remove-Item $tempZip -Force
              
              # Dọn dẹp backup cũ (giữ lại 3 backup gần nhất)
              Write-Host "Cleaning up old backups..."
              Get-ChildItem "C:\Temp\Publish-BE-Backup-*" -Directory | 
                Sort-Object CreationTime -Descending | 
                Select-Object -Skip 3 | 
                Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
              
              Write-Host "✓ Deployment completed successfully!"
            }
            
          } catch {
            Write-Error "❌ Deployment failed: $_"
            Write-Error $_.ScriptStackTrace
            
            # Rollback nếu có lỗi
            Invoke-Command -Session $session -ScriptBlock {
              $target = "C:\Users\Administrator\Desktop\Publish-BE"
              $oldDeploy = "C:\Users\Administrator\Desktop\Publish-BE-Old"
              
              Import-Module WebAdministration -ErrorAction SilentlyContinue
              
              $site = Get-ChildItem IIS:\Sites | Where-Object { 
                $_.PhysicalPath -like "*Publish-BE*" 
              } | Select-Object -First 1
              
              if ($site -and (Test-Path $oldDeploy)) {
                Write-Host "Rolling back to previous version..."
                $siteName = $site.Name
                $appPoolName = $site.applicationPool
                
                Set-ItemProperty "IIS:\Sites\$siteName" -Name physicalPath -Value $oldDeploy
                Restart-WebAppPool -Name $appPoolName -ErrorAction SilentlyContinue
                Write-Host "✓ Rollback completed"
              }
            } -ErrorAction SilentlyContinue
            
            exit 1
          } finally {
            if ($session) {
              Remove-PSSession $session
              Write-Host "Session closed"
            }
          }
